<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#13292e"><meta name="mobile-web-app-capable" content="yes"><title>World Music Scales Atlas</title><link rel="manifest" href="atlas.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="icon" href="mark.svg"><link rel="stylesheet" href="style.css?v=world4"></head>
<body><header><div class="mast"><a class="brand" href="./"><img src="mark.svg" alt="">World Music Scales Atlas</a><nav aria-label="Project"><a href="https://github.com/PersianMusicScales/international-music-scales-atlas/wiki">Guide</a></nav></div></header>
<main><div id="atlas"><div class="intro"><h1>Explore the atlas</h1></div><section class="mapbox"><div id="earth"></div><div id="picker" class="floating" hidden><button id="dismiss" aria-label="Close scale menu">×</button><h2 id="region-title"></h2><label id="scale-label">Scale and tuning<select id="model"></select></label><p id="coverage"></p></div><div class="mapbar"><details id="region-list"><summary>Browse regions</summary><label>Region or tradition<select id="region"></select></label></details><small>Natural Earth</small><button id="minus" aria-label="Zoom out">−</button><button id="plus" aria-label="Zoom in">+</button><button id="reset">Reset</button></div></section></div>
<article id="detail" hidden><h1 id="title" tabindex="-1"></h1><p id="subtitle"></p><div class="stage"><button id="return" title="Return to selected region" aria-label="Return to selected region"><span class="planet"></span><span>Atlas</span></button><button id="info" aria-haspopup="dialog" aria-expanded="false" aria-controls="explanation">ⓘ Info</button><div id="panels"></div><button id="signature" aria-haspopup="dialog" aria-expanded="false" aria-controls="score">♯ Signature</button><button id="play">▶ Play scale</button></div><p id="steps"></p><section class="overlay" id="explanation" aria-label="Scale information" role="dialog" hidden><button class="close" aria-label="Close scale information">×</button><div class="content"></div></section><section class="overlay" id="score" aria-label="Signature" role="dialog" hidden><button class="close" aria-label="Close signature">×</button><div class="content"></div></section><details id="settings"><summary>Tonic and tuning controls</summary><div class="controls"><label>Tonic<select id="tonic"></select></label><button id="left" aria-label="Transpose down 50 cents">−50¢</button><button id="right" aria-label="Transpose up 50 cents">+50¢</button><label>Spelling<select id="spelling"><option>Sharps</option><option>Flats</option></select></label><label>Start on degree<select id="degree"></select></label><label>Reference<select id="reference"><option>Major</option><option>Dorian</option><option>Nearest 12-TET</option></select></label><label>Compare with<select id="comparison"></select></label></div><div id="comparison-panel"></div></details></article></main>
<footer>Development preview <a href="https://github.com/PersianMusicScales/international-music-scales-atlas/issues">Feedback</a></footer><script type="module" src="app.js?v=world4"></script></body></html>
